name: AWS CD
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - homolog
      - prod
jobs:
  DeployToAWS:
    environment:
      name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v2
      - name: Determine AWS Account ID and Region
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_DEV }}" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
            echo "HOSTED_ZONE_ID=${{ secrets.DEV_HOSTED_ZONE_ID }}" >> $GITHUB_ENV
            echo "HOSTED_ZONE_NAME=${{ vars.DEV_HOSTED_ZONE_NAME }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "homolog" ]]; then
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_HOML }}" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
            echo "HOSTED_ZONE_ID=${{ secrets.HOML_HOSTED_ZONE_ID }}" >> $GITHUB_ENV
            echo "HOSTED_ZONE_NAME=${{ vars.HOML_HOSTED_ZONE_NAME }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "prod" ]]; then
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_PROD }}" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
            echo "HOSTED_ZONE_ID=${{ secrets.PROD_HOSTED_ZONE_ID }}" >> $GITHUB_ENV
            echo "HOSTED_ZONE_NAME=${{ vars.PROD_HOSTED_ZONE_NAME }}" >> $GITHUB_ENV
          else
            echo "Invalid branch name!" && exit 1
          fi
      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          role-session-name: github-action
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: Setting stage and stack name
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "STAGE=dev" >> $GITHUB_ENV
            echo "ACM_CERTIFICATE_ARN=${{ secrets.DEV_ACM_DEVMAUA_CERTIFICATE_ARN }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "homolog" ]]; then
            echo "STAGE=homolog" >> $GITHUB_ENV
            echo "ACM_CERTIFICATE_ARN=${{ secrets.HML_ACM_DEVMAUA_CERTIFICATE_ARN }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "prod" ]]; then
            echo "STAGE=prod" >> $GITHUB_ENV
            echo "ACM_CERTIFICATE_ARN=${{ secrets.PROD_ACM_DEVMAUA_CERTIFICATE_ARN }}" >> $GITHUB_ENV
          else
            echo "Invalid branch name!" && exit 1
          fi
          echo "STACK_NAME=PortfolioStackFront${{github.ref_name}}" >> $GITHUB_ENV
          echo "ALTERNATIVE_DOMAIN_NAME=${{ vars.ALTERNATIVE_DOMAIN_NAME }}" >> $GITHUB_ENV
      - name: Installing Dependencies
        run: |
          npm install
          npm install -g add aws-cdk
      - name: Build and Export
        run: |
          npm run build
        env:
          VITE_BUCKET_ASSETS: ${{ vars.VITE_BUCKET_ASSETS }}
      - name: Setup envs
        run: |
          echo AWS_REGION=${{ vars.AWS_REGION }} >> $GITHUB_ENV
          echo AWS_ACCOUNT_ID=${{ env.AWS_ACCOUNT_ID }} >> $GITHUB_ENV
          echo STACK_NAME=${{ env.STACK_NAME }} >> $GITHUB_ENV
          echo GITHUB_REF_NAME=${{ github.ref_name }} >> $GITHUB_ENV
          echo ACM_CERTIFICATE_ARN=${{ secrets.DEVMAUA_ACM_CERTIFICATE_ARN }} >> $GITHUB_ENV
          echo HOSTED_ZONE_ID=${{ secrets.DEVMAUA_HOSTED_ZONE_ID }} >> $GITHUB_ENV
          echo ALTERNATIVE_DOMAIN=${{ vars.ALTERNATIVE_DOMAIN_NAME }} >> $GITHUB_ENV
          echo STAGE=${{ github.ref_name }} >> $GITHUB_ENV
          echo S3_BUCKET_NAME=${{ vars.S3_BUCKET_NAME }} >> $GITHUB_ENV
      - name: Deploy with CDK
        run: |
          cd iac
          npm install
          cdk synth
          cdk deploy --require-approval never
      - name: Set CloudFront IDs
        run: |
          CLOUD_FRONT_ID=$(aws cloudformation --region ${{vars.AWS_REGION}} describe-stacks --stack-name ${{env.STACK_NAME}} --query "Stacks[0].Outputs[?OutputKey=='PortfolioDevMauaFrontDistributionId${{github.ref_name}}'].OutputValue" --output text)
          echo "CLOUD_FRONT_ID='$CLOUD_FRONT_ID'" >> $GITHUB_ENV
          CLOUD_FRONT_ID_BUCKET_ASSETS=${{ vars.CLOUD_FRONT_ID_BUCKET_ASSETS }}
          echo "CLOUD_FRONT_ID_BUCKET_ASSETS='$CLOUD_FRONT_ID_BUCKET_ASSETS'" >> $GITHUB_ENV
      - name: Set AWS Bucket
        run: |
          AWS_BUCKET=$(aws cloudformation --region ${{vars.AWS_REGION}} describe-stacks --stack-name ${{env.STACK_NAME}} --query "Stacks[0].Outputs[?OutputKey=='PortfolioDevMauaFrontBucketName${{github.ref_name}}'].OutputValue" --output text)
          echo "AWS_BUCKET='$AWS_BUCKET'" >> $GITHUB_ENV
      - name: Upload to S3
        run: aws s3 cp dist s3://${{env.AWS_BUCKET}}/ --recursive --region ${{ vars.AWS_REGION }}
      - name: Clear CDN cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{env.CLOUD_FRONT_ID}} --paths "/*" --region us-east-1
          aws cloudfront create-invalidation --distribution-id ${{env.CLOUD_FRONT_ID_BUCKET_ASSETS}} --paths "/*" --region us-east-1
